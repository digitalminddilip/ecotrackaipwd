version: '3.8'

services:
  ecotrack:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecotrack-ai:ibm-z
    container_name: ecotrack-ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CLEANCONNECT_DATABASE=/app/cleanconnect.db
    volumes:
      - ./cleanconnect.db:/app/cleanconnect.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
